name: CI

"on":
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt
      - name: Install libsndfile
        run: sudo apt-get update && sudo apt-get install -y libsndfile1
      - name: Install light test dependencies
        run: |
          python -m pip install -r .github/requirements-ci.txt
          python -m pip install --no-deps -e .
      - name: Run pytest
        env:
          CI: "1"
          GOURDSWORTH_NO_AUDIO: "1"
        run: python -m pytest -q

  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/requirements-pio.txt
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/esp32/platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-
      - uses: actions/cache@v4
        with:
          path: firmware/esp32/.pio/libdeps
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/esp32/platformio.ini') }}-libdeps
      - name: Install PlatformIO
        run: pip install -r .github/requirements-pio.txt
      - name: Build ESP32 firmware
        run: pio run -d firmware/esp32
