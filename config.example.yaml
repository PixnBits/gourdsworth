# Copy to config.yaml. Audio never written to disk.

mode: ptt          # ptt (spacebar) | vad (energy silence detect)
sample_rate: 16000
listen_limit_s: 8.0
silence_s: 0.55  # was 0.85; snappier end-of-utterance
energy_threshold: 0.012

ollama:
  host: http://127.0.0.1:11434
  # Prefer a pulled 7B–8B instruct. If missing, startup auto-picks the best local match
  # (14B instruct is OK when that is the smallest available).
  model: llama3.1:8b
  num_predict: 40
  temperature: 0.6

stt:
  model: base.en        # prefer base.en on porch; tiny.en for lower latency
  device: auto          # auto | cpu | cuda
  compute_type: int8

tts:
  engine: piper         # piper | espeak
  voice: en_US-danny-low  # elected; lessac-medium is a fine fallback
  speaker_id: 0

privacy:
  bind_host: 127.0.0.1
  save_audio: false
  save_transcripts: false
  session_log: memory   # memory | none  (never disk)

character: mayor
max_history_turns: 4
cooldown_s: 0.4

# Opt-in local CLIP still (issue #19 V0). Voice works without this.
# pip install -e '.[vision]'  then  python -m gourdsworth --snap
# Camera opens only on Talk / --snap. Frames stay in RAM. Nothing leaves the house.
vision:
  enabled: false
  camera_index: 0
  width: 640
  height: 480
  min_score: 0.15          # below this, label is homemade
  model: ViT-B-32
  pretrained: openai       # first load downloads ~350MB CLIP weights
  # labels_file: src/gourdsworth/costume_labels.txt
  # labels: [princess, prince, astronaut, dinosaur, firefighter, police, witch, wizard, ghost, superhero, ninja, pirate, animal, sports, robot, homemade, group]
