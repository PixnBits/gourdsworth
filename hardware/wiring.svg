<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1080" viewBox="0 0 1400 1080">
  <style>
    .bg { fill: #1c1916; }
    .box { fill: #2a2622; stroke: #c4a574; stroke-width: 1.5; }
    .box-ac { fill: #3a2824; stroke: #e07a5f; stroke-width: 1.5; }
    .box-5v { fill: #243028; stroke: #81b29a; stroke-width: 1.5; }
    .box-led { fill: #2c2618; stroke: #e9c46a; stroke-width: 1.5; }
    .box-srv { fill: #242830; stroke: #7eb6d6; stroke-width: 1.5; }
    .title { font: 600 18px "DejaVu Sans", "IBM Plex Sans", "Segoe UI", sans-serif; fill: #f4efe6; }
    .label { font: 13px "DejaVu Sans", "IBM Plex Sans", "Segoe UI", sans-serif; fill: #e7dfd2; }
    .small { font: 11px "DejaVu Sans", "IBM Plex Sans", "Segoe UI", sans-serif; fill: #b7aa98; }
    .pin { font: 12px "DejaVu Sans", "IBM Plex Sans", "Segoe UI", sans-serif; fill: #f4efe6; }
    .ac { stroke: #e07a5f; stroke-width: 2; fill: none; }
    .v5 { stroke: #e9c46a; stroke-width: 2.25; fill: none; }
    .srv5 { stroke: #5cbf8a; stroke-width: 2.5; fill: none; }
    .gnd { stroke: #8a8175; stroke-width: 2; fill: none; }
    .data { stroke: #f2cc8f; stroke-width: 1.75; fill: none; stroke-dasharray: 5 3; }
    .uart { stroke: #b5838d; stroke-width: 1.75; fill: none; }
    .i2c { stroke: #7eb6d6; stroke-width: 1.75; fill: none; }
    .srv { stroke: #90c2e0; stroke-width: 1.75; fill: none; }
    .cap { font: 11px "DejaVu Sans", "IBM Plex Sans", sans-serif; fill: #e9c46a; }
  </style>
  <rect class="bg" width="1400" height="1080"/>
  <text x="36" y="34" class="title">Porch greeter wiring — Pi 4, ESP32, 8×32 mouth, servos</text>
  <text x="36" y="54" class="small">Fused IEC inlet, earth to LRS FG. LED 5 V is not the servo rail or the Pi. Grounds meet at one star.</text>

  <rect class="box-ac" x="36" y="82" width="224" height="114" rx="6"/>
  <text x="52" y="106" class="label">Fused IEC inlet</text>
  <text x="52" y="128" class="small">C14, ~3 A slow-blow</text>
  <text x="52" y="148" class="small">earth to LRS FG</text>
  <text x="52" y="168" class="small">cord grip, drip loop</text>

  <rect class="box-5v" x="284" y="82" width="236" height="114" rx="6"/>
  <text x="300" y="106" class="label">LED brick</text>
  <text x="300" y="128" class="small">Mean Well LRS-150-5</text>
  <text x="300" y="148" class="small">5 V, 22 A · trim ~5.1 V</text>
  <text x="300" y="168" class="small">5 A mouth · 5 A eyes</text>

  <rect class="box-5v" x="544" y="82" width="206" height="114" rx="6"/>
  <text x="560" y="106" class="label">Servo brick</text>
  <text x="560" y="128" class="small">5 V, 8–10 A</text>
  <text x="560" y="148" class="small">8 A fuse, 18 AWG</text>
  <text x="560" y="168" class="small">to PCA9685 V+ only</text>

  <rect class="box-5v" x="774" y="82" width="216" height="114" rx="6"/>
  <text x="790" y="106" class="label">Pi brick</text>
  <text x="790" y="128" class="small">official USB-C</text>
  <text x="790" y="148" class="small">5.1 V, 3 A</text>
  <text x="790" y="168" class="small">into the Pi only</text>

  <rect class="box" x="1034" y="82" width="200" height="114" rx="6"/>
  <text x="1050" y="106" class="label">40 mm fan</text>
  <text x="1050" y="128" class="small">5 V, ~0.1 A</text>
  <text x="1050" y="148" class="small">from LED brick +</text>
  <text x="1050" y="168" class="small">not a pixel branch</text>

  <!-- 120 V bus above the bricks, short drops into each top edge -->
  <path class="ac" d="M148 82 V70 H882"/>
  <path class="ac" d="M402 70 V82"/>
  <path class="ac" d="M647 70 V82"/>
  <path class="ac" d="M882 70 V82"/>

  <rect class="box" x="284" y="248" width="300" height="242" rx="6"/>
  <text x="300" y="272" class="label">ESP32 DevKit V1</text>
  <text x="300" y="296" class="pin">5V ← LED brick; off for USB</text>
  <text x="300" y="318" class="pin">GND → common ground</text>
  <text x="300" y="340" class="pin">GPIO 16 RX ← Pi TX, 1 kΩ</text>
  <text x="300" y="362" class="pin">GPIO 17 TX → Pi RX</text>
  <text x="300" y="384" class="pin">GPIO 18 / 19 / 21 → shifter</text>
  <text x="300" y="406" class="pin">GPIO 22 SDA, 23 SCL → PCA</text>
  <text x="300" y="428" class="pin">3V3 → PCA9685 VCC</text>
  <text x="300" y="458" class="small">470 µF 105 °C at 5V. Wi-Fi off.</text>

  <rect class="box" x="774" y="248" width="286" height="242" rx="6"/>
  <text x="790" y="272" class="label">Raspberry Pi 4</text>
  <text x="790" y="296" class="pin">USB-C ← Pi brick</text>
  <text x="790" y="318" class="pin">GPIO 14 TX → RX 16, 1 kΩ</text>
  <text x="790" y="340" class="pin">GPIO 15 RX ← TX 17</text>
  <text x="790" y="362" class="pin">GPIO GND → common ground</text>
  <text x="790" y="390" class="small">enable_uart=1, not disable-bt</text>
  <text x="790" y="410" class="small">JBL speaker stays on Bluetooth</text>
  <text x="790" y="430" class="small">mini UART on 14/15, console off</text>
  <text x="790" y="458" class="small">no LED data, no servo pulses</text>

  <rect class="box-led" x="284" y="528" width="300" height="182" rx="6"/>
  <text x="300" y="552" class="label">74AHCT125</text>
  <text x="300" y="574" class="pin">VCC ← LED 5 V · 0.1 µF to GND</text>
  <text x="300" y="596" class="pin">OE1–3 → GND</text>
  <text x="300" y="618" class="pin">A1 ← 18 · A2 ← 19 · A3 ← 21</text>
  <text x="300" y="640" class="pin">10 kΩ pull-down, A1–A3 to GND</text>
  <text x="300" y="662" class="pin">Y1 Y2 Y3 out, 330 Ω each</text>
  <text x="300" y="684" class="small">A4 → GND. OE4 → GND or VCC.</text>

  <rect class="box-srv" x="640" y="528" width="300" height="182" rx="6"/>
  <text x="656" y="552" class="label">PCA9685</text>
  <text x="656" y="574" class="pin">VCC ← ESP32 3V3</text>
  <text x="656" y="596" class="pin">V+ ← servo brick, 8 A fuse</text>
  <text x="656" y="618" class="pin">GND → common ground</text>
  <text x="656" y="640" class="pin">SDA/SCL ← GPIO 22 / 23</text>
  <text x="656" y="662" class="pin">ch0 brow L · ch1 brow R</text>
  <text x="656" y="684" class="pin">ch2 hat · ch3 mustache (twirl)</text>

  <rect class="box-srv" x="980" y="528" width="254" height="182" rx="6"/>
  <text x="996" y="552" class="label">Servos × 4</text>
  <text x="996" y="576" class="pin">ch0 brow L · ch1 brow R</text>
  <text x="996" y="598" class="pin">ch2 hat · ch3 mustache</text>
  <text x="996" y="620" class="pin">signal ← PCA9685</text>
  <text x="996" y="642" class="pin">+ from V+, servo rail only</text>
  <text x="996" y="664" class="pin">− → common ground</text>

  <rect class="box-led" x="36" y="792" width="360" height="150" rx="6"/>
  <text x="52" y="816" class="label">Mouth 8×32 panel</text>
  <text x="52" y="838" class="pin">256 px, ~32 × 8 cm, 10 mm</text>
  <text x="52" y="860" class="pin">5 V both ends, 5 A branch</text>
  <text x="52" y="882" class="pin">DIN ← Y1, 330 Ω, GND beside</text>
  <text x="52" y="904" class="small">1000 µF 105 °C at each end</text>
  <text x="52" y="922" class="small">serpentine; check mouthIndex()</text>

  <rect class="box-led" x="416" y="792" width="254" height="150" rx="6"/>
  <text x="432" y="816" class="label">Eye L</text>
  <text x="432" y="840" class="pin">16 px from the 60/m reel</text>
  <text x="432" y="862" class="pin">5 V ← eyes branch, 5 A</text>
  <text x="432" y="884" class="pin">DIN ← Y2, 330 Ω, with GND</text>
  <text x="432" y="908" class="small">1000 µF 105 °C at the feed</text>

  <rect class="box-led" x="690" y="792" width="250" height="150" rx="6"/>
  <text x="706" y="816" class="label">Eye R</text>
  <text x="706" y="840" class="pin">16 px, own data line</text>
  <text x="706" y="862" class="pin">5 V ← same eyes branch</text>
  <text x="706" y="884" class="pin">DIN ← Y3, 330 Ω, with GND</text>
  <text x="706" y="908" class="small">1000 µF 105 °C at the feed</text>

  <rect class="box" x="968" y="792" width="266" height="150" rx="6"/>
  <text x="984" y="816" class="label">Common ground</text>
  <text x="984" y="840" class="pin">LED brick and servo brick</text>
  <text x="984" y="862" class="pin">ESP32, Pi, shifter, PCA9685</text>
  <text x="984" y="884" class="pin">one star point</text>
  <text x="984" y="908" class="small">Pi brick GND is the Pi ground.</text>

  <!-- LED 5 V: left corridor, both mouth ends, both eyes, shifter VCC, ESP32 -->
  <path class="v5" d="M310 196 V206 H26 V774 H880"/>
  <path class="v5" d="M26 620 H284"/>
  <path class="v5" d="M110 774 V792"/>
  <path class="v5" d="M310 774 V792"/>
  <path class="v5" d="M560 774 V792"/>
  <path class="v5" d="M860 774 V792"/>
  <path class="v5" d="M460 196 V248"/>
  <path class="v5" d="M860 196 V248"/>

  <!-- Servo 5 V down the gap between ESP32 and the Pi, into PCA9685 -->
  <path class="srv5" d="M647 196 V218 H736 V500 H820 V528"/>
  <text x="640" y="288" class="small">servo 5 V</text>

  <!-- ESP32 GPIO 18/19/21 into the shifter -->
  <path class="data" d="M340 490 V528"/>
  <path class="data" d="M400 490 V528"/>
  <path class="data" d="M460 490 V528"/>
  <text x="472" y="514" class="small">18 · 19 · 21</text>

  <!-- Data to the panel and eyes, grey return beside each -->
  <path class="data" d="M350 710 V724 H150 V792"/>
  <path class="gnd" d="M358 710 V730 H158 V792"/>
  <path class="data" d="M430 710 V738 H530 V792"/>
  <path class="gnd" d="M438 710 V744 H538 V792"/>
  <path class="data" d="M510 710 V752 H790 V792"/>
  <path class="gnd" d="M518 710 V758 H798 V792"/>

  <!-- UART with 1 kΩ, and a ground return beside it -->
  <path class="uart" d="M584 332 H774"/>
  <path class="gnd" d="M584 342 H774"/>
  <text x="600" y="324" class="small">UART · 1 kΩ</text>

  <!-- I2C and a ground return beside it -->
  <path class="i2c" d="M584 400 H600 V520 H700 V528"/>
  <path class="gnd" d="M584 408 H616 V524 H716 V528"/>
  <text x="632" y="470" class="small">I2C</text>

  <!-- Grounds to the star: left bus, right bus, PCA side gap -->
  <path class="gnd" d="M330 196 V232 H12 V960 H1100 V942"/>
  <path class="gnd" d="M284 460 H12"/>
  <path class="gnd" d="M284 650 H12"/>
  <path class="gnd" d="M700 196 V210 H846 Q860 228 874 210 H1310 V870 H1234"/>
  <path class="gnd" d="M1060 476 H1310"/>
  <path class="gnd" d="M940 640 H954 V860 H968"/>

  <text x="36" y="996" class="small">Solid amber: LED 5 V. Solid green: servo 5 V. Dashed amber: data after the shifter. Mauve: UART. Blue: I2C. Grey: ground. Coral: 120 V.</text>
  <text x="36" y="1018" class="small">Power order: bricks on, then data. Data off before bricks. Do not hot-plug a strip into a live brick without the capacitor already across it.</text>
  <text x="36" y="1040" class="small">Capacitors: four 1000 µF 16 V 105 °C at the feeds (mouth left, mouth right, eye L, eye R), one 470 µF 16 V 105 °C at the ESP32 5 V pin, one 0.1 µF ceramic at the shifter VCC.</text>
</svg>
