; ESP32 DevKit V1 (WROOM-32). Not S3, not C3.
; FastLED clocks the three WS2812 runs on RMT. Do not define FASTLED_ESP32_I2S.
; Pin FastLED 3.6.0 exactly: ^3.6.0 pulls 3.10.6, which errors on
; FASTLED_ALLOW_INTERRUPTS=0 and overflows flash.
; Adafruit PWM Servo Driver talks to the PCA9685. Servo power is the board V+ rail.

[env:esp32dev]
platform = espressif32@7.1.3
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
lib_deps =
    fastled/FastLED@3.6.0
    adafruit/Adafruit PWM Servo Driver Library@2.4.1
build_flags =
    -DFASTLED_ALLOW_INTERRUPTS=0
    -DFULL_WHITE_TEST=0
    -DMOUTH_COLS=32
    -DMOUTH_ROWS=8
    -DEYE_LEDS=16
